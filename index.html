<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>动森物品查询 - acnh.daozhu.com</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=20260717u">
<style>
.order-btn{margin-top:4px}
.backpack-item-qty-num{font-size:12px;color:#666;margin-left:auto;font-weight:600;white-space:nowrap;}
.qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid #aaa;background:#f2f2f2;color:#333;font-size:14px;line-height:1;cursor:pointer;padding:0;}
.order-qty-stepper{display:flex;align-items:center;gap:8px;margin:6px 0 2px;}
.order-qty-stepper input{width:64px;text-align:center;font-size:16px;padding:6px;border:2px solid #b8cbb8;border-radius:6px;box-sizing:border-box;}
.history-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border:1px solid #e0e0e0;border-radius:8px;margin-bottom:8px;background:#fafafa;cursor:pointer;}
.history-row-main{flex:1;min-width:0;}
.history-row-id{font-weight:600;font-size:14px;}
.history-row-meta{font-size:12px;color:#888;margin-top:2px;}
.history-del{width:26px;height:26px;border:none;background:none;color:#c0392b;font-size:18px;cursor:pointer;}
.history-detail-id{font-weight:700;font-size:15px;}
.history-detail-meta{font-size:12px;color:#888;margin:2px 0 6px;}
.history-detail-dodo,.history-detail-villager{font-size:13px;margin:3px 0;color:#444;}
.history-items{margin-top:8px;}
.history-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #e5e5e5;}
.history-item-img{width:40px;height:40px;object-fit:contain;}
.history-item-name{flex:1;font-size:13px;}
.history-item-variant{color:#888;font-size:12px;}
.history-item-qty{font-size:13px;color:#555;font-weight:600;}
</style>
</head>
<body>
    <div class="header">
        <h1 class="page-title">🎮 动森物品查询小助手</h1>
        <div class="search-bar">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="输入物品名称搜索...">
                <button id="clearBtn" class="clear-btn"><i class="fas fa-times"></i></button>
                <i class="fas fa-search search-icon"></i>
            </div>
            <button id="searchBtn" class="search-btn">搜索</button>
        </div>
        <div class="cat-select">
            <select id="catSelect">
                <option value="all">全部分类</option>
            </select>
        </div>
        <div class="lang-select">
            <select id="langSelect">
                <option value="zhs">简体中文</option>
                <option value="zht">繁體中文</option>
            </select>
        </div>
    </div>

    <textarea id="command-text"></textarea>

    <div class="container">
        <div id="itemsContainer" class="items-grid"></div>
        <div id="randomItemsSection">
            <div class="random-title">🍃 随机推荐物品 🍃</div>
            <div id="randomItemsContainer" class="items-grid"></div>
        </div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <div class="empty-icon"><i class="fas fa-search"></i></div>
            <div class="empty-text">请输入物品名称开始搜索</div>
        </div>
    </div>

    <!-- Backpack Floating Button -->
    <div class="backpack-fab-container" id="backpackFabContainer">
        <button class="backpack-fab" id="backpackFab">
            <i class="fas fa-shopping-bag"></i>
            <span class="backpack-fab-badge" id="backpackFabBadge">0</span>
            <span class="backpack-fab-text">背包</span>
        </button>
    </div>

    <!-- History Floating Button -->
    <div style="position:fixed;left:88px;top:50%;transform:translateY(-50%);z-index:99;" id="historyFabContainer">
        <button class="backpack-fab" id="historyFab" style="background:var(--acnh-purple,#8e6bb0);border-color:#7a5ba0;box-shadow:0 3px 0 #6b4f8f;">
            <i class="fas fa-history"></i>
            <span class="backpack-fab-text">历史</span>
        </button>
    </div>

    <!-- Backpack Modal -->
    <div class="modal-overlay" id="backpackModal">
        <div class="modal" style="max-width:520px;">
            <div class="modal-header">
                <div class="modal-title">🎒 背包 <span id="backpackCountText">0/80</span></div>
                <button class="modal-close" id="closeBackpackModal">&times;</button>
            </div>
            <div class="modal-body" style="max-height:420px;overflow-y:auto;">
                <div class="backpack-items" id="backpackItems"></div>
                <div id="orderResult" style="display:none;margin-top:8px;"></div>
            </div>
            <div class="modal-footer" style="justify-content:space-between;flex-wrap:wrap;gap:8px;">
                <button class="modal-btn" id="clearBackpackBtn" style="background:var(--acnh-red);color:white;border:2px solid #c0392b;box-shadow:0 3px 0 #c0392b;font-size:13px;">🗑️ 清空</button>
                <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                    <button class="modal-btn modal-btn-confirm" id="orderBtn" style="font-size:13px;padding:8px 14px;">📋 生成订单</button>
                    <input id="expressDodoInput" maxlength="5" placeholder="DODO" style="width:92px;padding:8px 6px;border:2px solid #b8cbb8;border-radius:6px;font-size:14px;letter-spacing:2px;text-transform:uppercase;text-align:center;outline:none;">
                    <button class="modal-btn modal-btn-confirm" id="expressOrderBtn" style="background:var(--acnh-blue,#1f6fb8);border-color:#1f6fb8;box-shadow:0 3px 0 #1f6fb8;font-size:13px;padding:8px 14px;">🚚 生成快递订单</button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal" style="max-width:520px;">
            <div class="modal-header">
                <div class="modal-title">📜 历史订单</div>
                <button class="modal-close" id="closeHistoryModal">&times;</button>
            </div>
            <div class="modal-body" style="max-height:420px;overflow-y:auto;">
                <div id="historyList"></div>
                <div id="historyDetail" style="display:none;"></div>
            </div>
            <div class="modal-footer" style="justify-content:space-between;">
                <button class="modal-btn" id="historyBackBtn" style="display:none;background:var(--acnh-gray,#999);border-color:#888;box-shadow:0 3px 0 #777;font-size:13px;">← 返回列表</button>
                <button class="modal-btn" id="clearHistoryBtn" style="background:var(--acnh-red);color:white;border:2px solid #c0392b;box-shadow:0 3px 0 #c0392b;font-size:13px;">🗑️ 清空历史</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="loading-overlay" id="loadingOverlay" style="display:none;"><div class="loading-spinner"></div></div>

    <!-- Item Detail Modal -->
    <div class="modal-overlay" id="itemDetailModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">物品详情</div>
                <button class="modal-close" id="closeItemModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="item-detail-container">
                    <div class="item-image-container">
                        <img id="itemImage" class="item-image" src="" alt="" style="display:none;">
                        <div class="image-placeholder"><i class="fas fa-image"></i><div class="placeholder-text">暂无图片</div></div>
                    </div>
                    <div class="item-detail-name" id="itemDetailName"></div>
                    <div class="item-detail-id" id="itemDetailId"></div>
                </div>
                <div class="item-type-selection">
                    <div class="type-selection-title">选择物品类型</div>
                    <div class="type-options" id="typeOptions">
                        <label class="type-option"><input type="radio" name="itemType" value="normal" checked><span class="type-label">普通物品</span></label>
                        <label class="type-option"><input type="radio" name="itemType" value="diy"><span class="type-label">DIY手册</span></label>
                        <label class="type-option"><input type="radio" name="itemType" value="bottle"><span class="type-label">漂流瓶</span></label>
                    </div>
                </div>
                <div class="item-type-selection" id="itemSpecSelection" style="display:none;">
                    <div class="type-selection-title" id="specSelectionTitle">选择规格</div>
                    <div class="spec-grid" id="specOptions"></div>
                </div>
                <div class="item-type-selection" id="itemQtySelection">
                    <div class="type-selection-title">数量</div>
                    <div class="order-qty-stepper">
                        <button type="button" class="qty-btn" id="itemQtyMinus">−</button>
                        <input type="number" id="itemQtyInput" value="1" min="1" max="120" inputmode="numeric">
                        <button type="button" class="qty-btn" id="itemQtyPlus">+</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-cancel" id="cancelAddItem">取消</button>
                <button class="modal-btn modal-btn-confirm" id="confirmAddItem">添加到背包</button>
            </div>
        </div>
    </div>

    <!-- Villager Invite Modal -->
    <div class="modal-overlay" id="villagerModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">邀请村民</div>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-search">
                    <input type="text" class="modal-search-input" id="villagerSearchInput" placeholder="输入村民名称...">
                </div>
                <div class="villagers-grid" id="villagersGrid"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-cancel" id="cancelInvite">取消</button>
                <button class="modal-btn modal-btn-confirm" id="confirmInvite">确定邀请</button>
            </div>
        </div>
    </div>

    <!-- Floating Invite Button -->
    <div class="invite-btn-container" id="inviteBtnContainer">
        <button class="invite-btn" id="inviteBtn">
            <i class="fas fa-user-plus"></i>
            <span class="invite-btn-text">邀请村民</span>
        </button>
    </div>

    <!-- Floating Villager Preview -->
    <div class="villager-preview-container" id="villagerPreviewContainer">
        <div class="villager-preview" id="villagerPreview">
            <img class="villager-avatar" id="villagerAvatar" src="" alt="">
            <div class="villager-info">
                <div class="villager-name" id="villagerName"></div>
            </div>
            <div class="remove-villager" id="removeVillager"><i class="fas fa-times"></i></div>
        </div>
    </div>

    <footer style="padding:18px;text-align:center;font-size:13px;color:#999;">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:#888;text-decoration:none;">粤ICP备2026105541号-1</a>
    </footer>

    <script src="app.js?v=20260830b"></script>
</body>
</html>
